name: test
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore: ["proofs/**", "reductions/**", "statements/**"]
  pull_request:
    paths-ignore: ["proofs/**", "reductions/**", "statements/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Submission gate (lint)
        run: python3 -I tests/test_lint.py
      - name: Agent client (oma.sh) against a mock desk
        run: bash tests/test_oma.sh
      - name: Type check and build
        run: npx tsc --noEmit && npm run build
      - name: Start the site (desk offline in CI)
        run: (npx next start -p 3123 &) && for i in $(seq 1 40); do curl -s -o /dev/null localhost:3123 && break; sleep 1; done
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          node -e "require('playwright')" 2>/dev/null || npm i --no-save playwright@1.56.1
          BASE=http://localhost:3123 node tests/e2e.mjs
      - name: Sweep 2,000 random problems (page + agent brief)
        run: BASE=http://localhost:3123 node tests/sweep.mjs 2000
