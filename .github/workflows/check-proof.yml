# Untrusted stage: compiles a submitted proof. No secrets, read-only token.
# The trusted stage (verdict.yml) re-checks the diff itself before believing this verdict.
name: check-proof
on:
  pull_request:
    paths: ["proofs/**", "reductions/**", "statements/**"]
permissions:
  contents: read
concurrency:
  group: check-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exactly one new file under proofs/ or reductions/
        id: diff
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-status "$BASE"...HEAD > /tmp/diff.txt
          cat /tmp/diff.txt
          [ "$(wc -l < /tmp/diff.txt)" = "1" ] || { echo "verdict=rejected" >> "$GITHUB_OUTPUT"; echo '{"verdict":"rejected","reason":"a pull request must add exactly one file under proofs/, reductions/ or statements/ and change nothing else"}' > verdict.json; exit 0; }
          read -r ST F < /tmp/diff.txt
          # Strict whitelist: the file name is attacker-controlled and is used in later steps.
          if [ "$ST" != "A" ] || ! printf '%s' "$F" | grep -Eq "^(proofs|reductions)/[A-Za-z0-9_.'-]+\.lean$"; then
            echo '{"verdict":"rejected","reason":"the one change must be a new file proofs/<id>.lean, reductions/<id>.R<n>.lean or statements/<id>.lean (letters, digits, _ . - only)"}' > verdict.json; exit 0
          fi
          echo "file=$F" >> "$GITHUB_OUTPUT"
      - name: Lint (before anything compiles)
        if: steps.diff.outputs.file != ''
        id: lint
        env:
          FILE: ${{ steps.diff.outputs.file }}
        run: |
          python3 -I tools/lint.py "$FILE" data/catalog.json > /tmp/lint.json && echo "ok=1" >> "$GITHUB_OUTPUT" || { cat /tmp/lint.json; python3 -I -c 'import json;d=json.load(open("/tmp/lint.json"));d.update(verdict="rejected",reason="lint: "+"; ".join(d["errors"]));json.dump(d,open("verdict.json","w"))'; }
      - name: Pinned formal-conjectures
        if: steps.lint.outputs.ok == '1'
        id: fc
        run: |
          C=$(python3 -I -c 'import json;print(json.load(open("data/catalog.json"))["meta"]["upstreamCommit"])')
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          git init -q "$RUNNER_TEMP/fc" && cd "$RUNNER_TEMP/fc"
          git remote add origin https://github.com/google-deepmind/formal-conjectures
          git fetch -q --depth 1 origin "$C" && git checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        if: steps.lint.outputs.ok == '1'
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/fc/.lake
          key: fc-${{ steps.fc.outputs.commit }}
      - name: Lean toolchain and Mathlib cache
        if: steps.lint.outputs.ok == '1'
        run: |
          if ! command -v lake >/dev/null && [ ! -x ~/.elan/bin/lake ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP/fc" && ~/.elan/bin/lake exe cache get
      - name: Compile and audit axioms
        if: steps.lint.outputs.ok == '1'
        env:
          FILE: ${{ steps.diff.outputs.file }}
        run: OMA_FC="$RUNNER_TEMP/fc" tools/check.sh "$FILE" verdict.json || true
      - name: Record PR number
        run: |
          echo "${{ github.event.pull_request.number }}" > pr.txt
          [ -f verdict.json ] || echo '{"verdict":"fault","reason":"checker produced no verdict"}' > verdict.json
          python3 -I -c 'import json;d=json.load(open("verdict.json"));print(d["verdict"], "-", d["reason"])'
      - uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: |
            verdict.json
            pr.txt
