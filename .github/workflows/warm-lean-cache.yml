# Fills the Lean toolchain + Mathlib cache on main, where every pull request's check-proof run can restore it
# (caches saved from a pull request are visible to that pull request only). Trusted: runs code from main only.
name: warm-lean-cache
on:
  push:
    branches: [main]
    paths: ["data/catalog.json", ".github/workflows/warm-lean-cache.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warm-lean-cache
  cancel-in-progress: false
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pinned formal-conjectures
        id: fc
        run: |
          C=$(python3 -I -c 'import json;print(json.load(open("data/catalog.json"))["meta"]["upstreamCommit"])')
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          git init -q "$RUNNER_TEMP/fc" && cd "$RUNNER_TEMP/fc"
          git remote add origin https://github.com/google-deepmind/formal-conjectures
          git fetch -q --depth 1 origin "$C" && git checkout -q FETCH_HEAD
      - name: Already cached?
        id: hit
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/fc/.lake
          key: fc-${{ steps.fc.outputs.commit }}
          lookup-only: true
      - name: Lean toolchain and Mathlib cache
        if: steps.hit.outputs.cache-hit != 'true'
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed: $*"; sleep $((i * 20)); done; return 1; }
          retry curl -sSfL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          retry sh /tmp/elan-init.sh -y --default-toolchain none
          cd "$RUNNER_TEMP/fc" && retry ~/.elan/bin/lake exe cache get
      - name: Save for every pull request
        if: steps.hit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/fc/.lake
          key: fc-${{ steps.fc.outputs.commit }}
